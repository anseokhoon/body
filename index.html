      };

        <div className="min-h-screen font-sans text-[#F1EDE3] pb-24 md:pb-8 relative selection:bg-teal-500 selection:text-white">
          
          {/* PC 헤더 */}
          <header className="hidden md:flex bg-[#1E1D17] border-b border-[#2D2B23] sticky top-0 z-40 shadow-sm">
            <div className="max-w-5xl mx-auto px-8 py-4 flex items-center justify-between w-full">
              <div className="flex items-center gap-3">
                <div className="bg-teal-600 p-2 rounded-lg shadow-lg shadow-teal-900/30">
                  <Camera className="text-[#15140F] w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-xl font-black tracking-tight text-[#F1EDE3]">바프 12주 다이어리</h1>
                </div>
              </div>
              
              <div className="flex bg-[#15140F] p-1.5 rounded-xl border border-[#2D2B23]">
                <button onClick={() => setActiveTab('workout')} className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'workout' ? 'bg-teal-600 text-[#15140F]' : 'text-[#A39D8D] hover:text-[#F1EDE3]'}`}>
                  <Dumbbell className="w-4 h-4 inline-block mr-2 mb-0.5" /> 루틴
                </button>
                <button onClick={() => setActiveTab('calendar')} className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'calendar' ? 'bg-teal-600 text-[#15140F]' : 'text-[#A39D8D] hover:text-[#F1EDE3]'}`}>
                  <CalendarDays className="w-4 h-4 inline-block mr-2 mb-0.5" /> 기록
                </button>
                <button onClick={() => setActiveTab('knee')} className={`px-6 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === 'knee' ? 'bg-teal-600 text-[#15140F]' : 'text-[#A39D8D] hover:text-[#F1EDE3]'}`}>
                  <HeartPulse className="w-4 h-4 inline-block mr-2 mb-0.5" /> 케어
                </button>
              </div>
            </div>
          </header>

          {/* 모바일 헤더 */}
          <header className="md:hidden bg-[#1E1D17] border-b border-[#2D2B23] sticky top-0 z-40 px-4 py-3 flex items-center justify-center">
             <h1 className="text-lg font-black tracking-tight text-[#F1EDE3]">바프 12주 다이어리</h1>
          </header>

          <div className="max-w-5xl mx-auto p-4 md:p-8">

            {/* --- 1. 운동 루틴 탭 --- */}
            {activeTab === 'workout' && (
              <div className="animate-in">
                {/* 상단 요일 선택 버튼 */}
                <div className="flex overflow-x-auto hide-scrollbar bg-[#1E1D17] rounded-xl shadow-lg mb-6 p-2 space-x-2 border border-[#2D2B23]">
                  {workoutData.map((dayObj, index) => (
                    <button
                      key={index}
                      onClick={() => setActiveDay(index)}
                      className={`flex-1 min-w-[80px] py-3 px-2 rounded-lg text-sm font-bold transition-all duration-200 whitespace-nowrap ${
                        activeDay === index
                          ? 'bg-teal-600 text-[#15140F] shadow-md'
                          : 'bg-transparent text-[#A39D8D] hover:bg-[#2D2B23]'
                      }`}
                    >
                      {dayObj.short}
                    </button>
                  ))}
                </div>

                {/* 해당 요일 제목 및 포커스 */}
                <div className="bg-[#1E1D17] p-5 rounded-2xl shadow-lg border border-[#2D2B23] border-l-4 border-l-teal-500 mb-6 flex items-center gap-4">
                  <Target className="w-8 h-8 text-teal-500 shrink-0" />
                  <div>
                    <h2 className="text-lg md:text-xl font-bold text-[#F1EDE3] mb-1">{workoutData[activeDay].title}</h2>
                    <p className="text-[#A39D8D] text-sm">{workoutData[activeDay].focus}</p>
                  </div>
                </div>

                {/* 운동 목록 렌더링 */}
                <main className="space-y-6">
                  {workoutData[activeDay].exercises.map((exercise, index) => {
                    const isCompleted = !!completedWorkouts[exercise.name];

                    return (
                      <div key={index} className={`bg-[#1E1D17] rounded-3xl shadow-lg border overflow-hidden flex flex-col group transition-all duration-300 ${isCompleted ? 'border-teal-500/50 bg-[#1e2723]' : 'border-[#2D2B23]'}`}>
                        <div className="p-6 md:p-8 flex flex-col justify-between">
                          <div>
                            {/* 타이틀 및 완료 체크 버튼 */}
                            <div className="flex items-center justify-between mb-5">
                              <div className="flex items-center">
                                <div className="bg-[#15140F] text-teal-500 font-black w-10 h-10 rounded-full flex items-center justify-center mr-4 shrink-0 text-lg border border-[#2D2B23]">
                                  {index + 1}
                                </div>
                                <h3 className="text-xl md:text-2xl font-bold text-[#F1EDE3]">{exercise.name}</h3>
                              </div>
                              
                              <button 
                                onClick={() => handleToggleExercise(exercise.name)}
                                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold border transition-all shrink-0 ${
                                  isCompleted 
                                    ? 'bg-teal-500 text-[#15140F] border-teal-500' 
                                    : 'bg-[#15140F] border-[#2D2B23] text-[#A39D8D]'
                                }`}
                              >
                                <CheckCircle className="w-4 h-4" />
                                <span className="hidden md:inline">{isCompleted ? "완료됨" : "오늘 완료 체크"}</span>
                                <span className="md:hidden">{isCompleted ? "완료" : "체크"}</span>
                              </button>
                            </div>

                            {/* 기구/운동 묘사 */}
                            <div className="bg-[#15140F] rounded-2xl p-5 mb-6 border border-[#2D2B23]">
                              <p className="text-xs font-bold text-[#A39D8D] mb-1 tracking-wider uppercase">기구/동작 묘사</p>
                              <p className="text-sm md:text-base font-semibold text-[#F1EDE3]">{exercise.visual}</p>
                            </div>

                            {/* 어떻게 하나요? */}
                            <div className="flex items-start space-x-3 mb-6 pl-2">
                              <Activity className="w-6 h-6 text-emerald-500 mt-1 shrink-0" />
                              <div>
                                <p className="text-xs font-bold text-[#A39D8D] mb-1 tracking-wider uppercase">어떻게 하나요?</p>
                                <p className="text-[#C2BCAB] text-sm md:text-base leading-relaxed">{exercise.action}</p>
                              </div>
                            </div>
                          </div>

                          {/* 횟수 및 유튜브 링크 버튼 */}
                          <div className="flex flex-wrap items-center justify-between border-t border-[#2D2B23] pt-5 mt-2 gap-3">
                            <div className="flex items-center bg-orange-900/20 text-orange-400 px-4 py-2.5 rounded-xl text-sm font-bold border border-orange-900/40">
                              <Flame className="w-5 h-5 mr-2" />
                              {exercise.reps}
                            </div>
                            
                            <a 
                              href={`https://www.youtube.com/results?search_query=${encodeURIComponent(exercise.searchQuery)}`}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="flex items-center bg-[#E53E3E] text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm"
                            >
                              <Youtube className="w-5 h-5 mr-2" />
                              자세 영상 보기
                            </a>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </main>
              </div>
            )}

            {/* --- 2. 달력 기록 탭 --- */}
            {activeTab === 'calendar' && (
              <div className="animate-in max-w-lg mx-auto">
                <div className="bg-[#1E1D17] p-6 rounded-3xl shadow-lg border border-[#2D2B23] mb-6">
                  {/* 달력 월 이동 */}
                  <div className="flex justify-between items-center mb-6">
                    <button onClick={prevMonth} className="p-2 bg-[#15140F] rounded-xl hover:bg-[#2D2B23] transition-colors"><ChevronRight className="w-5 h-5 rotate-180" /></button>
                    <h2 className="text-xl font-bold">{currentMonth.getFullYear()}년 {currentMonth.getMonth() + 1}월</h2>
                    <button onClick={nextMonth} className="p-2 bg-[#15140F] rounded-xl hover:bg-[#2D2B23] transition-colors"><ChevronRight className="w-5 h-5" /></button>
                  </div>

                  {/* 요일 라벨 */}
                  <div className="grid grid-cols-7 gap-2 mb-2">
                    {['일', '월', '화', '수', '목', '금', '토'].map((day, i) => (
                      <div key={day} className={`text-center text-xs font-bold ${i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-[#A39D8D]'}`}>
                        {day}
                      </div>
                    ))}
                  </div>

                  {/* 날짜 그리드 */}
                  <div className="grid grid-cols-7 gap-2">
                    {Array.from({ length: firstDay }).map((_, i) => (
                      <div key={`empty-${i}`} className="aspect-square rounded-xl bg-transparent"></div>
                    ))}
                    
                    {Array.from({ length: daysInMonth }).map((_, i) => {
                      const day = i + 1;
                      const dateString = formatDateString(currentMonth.getFullYear(), currentMonth.getMonth(), day);
                      const isToday = dateString === formatDateString(today.getFullYear(), today.getMonth(), today.getDate());
                      const record = records[dateString];
                      const recordConfig = recordOptions.find(opt => opt.id === record);
                      
                      const currentDayOfWeek = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day).getDay();
                      const isHoliday = !!koreanHolidays[dateString];
                      const isRedDay = currentDayOfWeek === 0 || isHoliday;

                      return (
                        <button
                          key={day}
                          onClick={() => setSelectedDate(dateString)}
                          className={`relative aspect-square rounded-xl flex flex-col items-center justify-center transition-all ${
                            isToday ? 'border border-teal-500 bg-teal-500/10' : 'bg-[#15140F] border border-[#2D2B23] hover:bg-[#2D2B23]'
                          }`}
                        >
                          <span className={`text-sm font-bold ${
                            isToday ? 'text-teal-400' : 
                            isRedDay ? 'text-red-400' : 
                            'text-[#F1EDE3]'
                          }`}>{day}</span>
                          
                          {/* 공휴일 표기 */}
                          {isHoliday && <span className="text-[9px] text-red-400 mt-0.5 hidden md:block">{koreanHolidays[dateString]}</span>}

                          {/* 달력 스티커 점 */}
                          {recordConfig && (
                            <div className={`absolute bottom-1.5 w-2 h-2 rounded-full ${recordConfig.color}`}></div>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 기록 선택 모달 */}
                {selectedDate && (
                  <div className="fixed inset-0 z-50 bg-black/80 flex items-end md:items-center justify-center p-4">
                    <div className="bg-[#1E1D17] w-full max-w-sm rounded-3xl p-6 border border-[#2D2B23] animate-in">
                      <div className="flex justify-between items-center mb-6 border-b border-[#2D2B23] pb-4">
                        <h3 className="text-lg font-bold text-[#F1EDE3]">{selectedDate.split('-')[1]}월 {selectedDate.split('-')[2]}일 기록</h3>
                        <button onClick={() => setSelectedDate(null)} className="p-1 hover:bg-[#2D2B23] rounded-lg"><X className="w-5 h-5 text-[#A39D8D]" /></button>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-3 mb-6">
                        {recordOptions.map((opt) => (
                          <button
                            key={opt.id}
                            onClick={() => handleRecordSelect(opt.id)}
                            className={`p-3 rounded-xl border flex items-center justify-center transition-all font-bold text-sm ${
                              records[selectedDate] === opt.id 
                                ? `${opt.color} border-transparent text-white shadow-lg` 
                                : 'bg-[#15140F] border-[#2D2B23] text-[#A39D8D]'
                            }`}
                          >
                            {records[selectedDate] === opt.id && <Check className="w-4 h-4 mr-1.5" />}
                            {opt.label}
                          </button>
                        ))}
                      </div>

                      {records[selectedDate] && (
                        <button onClick={removeRecord} className="w-full py-3 bg-red-900/20 text-red-400 rounded-xl font-bold text-sm">
                          기록 삭제
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* --- 3. 케어(무릎 관리) 탭 --- */}
            {activeTab === 'knee' && (
              <div className="animate-in space-y-6">
                
                <div className="bg-red-900/20 border border-red-500/40 rounded-3xl p-6 text-center shadow-lg">
                  <AlertTriangle className="text-red-400 w-8 h-8 mx-auto mb-3" />
                  <h2 className="text-xl font-extrabold text-red-400 mb-2">무릎 통증 시 러닝 즉시 중단</h2>
                  <p className="text-red-200/80 text-sm leading-relaxed">
                    무릎 앞쪽이나 바깥쪽에 통증이 있다면 통증이 사라질 때까지 하체 부하가 걸리는 러닝은 쉬어야 합니다. 유산소는 아래 대체 운동으로 진행하세요.
                  </p>
                </div>

                <div className="bg-[#1E1D17] rounded-3xl p-6 shadow-lg border border-[#2D2B23] border-l-4 border-l-teal-500">
                  <h2 className="text-lg font-bold text-[#F1EDE3] mb-4 flex items-center"><RefreshCcw className="w-5 h-5 text-teal-500 mr-2" /> 대체 유산소 (무릎 보호)</h2>
                  <div className="space-y-3">
                    <div className="p-4 bg-[#15140F] rounded-2xl border border-[#2D2B23]">
                      <h3 className="font-bold text-teal-400 text-sm mb-1">🚲 실내 자전거 (추천)</h3>
                      <p className="text-xs text-[#A39D8D]">저항을 가볍게, 안장을 높여 다리를 곧게 뻗으며 타세요. 무릎 관절에 가해지는 체중 부하를 없애줍니다.</p>
                    </div>
                    <div className="p-4 bg-[#15140F] rounded-2xl border border-[#2D2B23]">
                      <h3 className="font-bold text-blue-400 text-sm mb-1">🏊‍♂️ 수영 / 아쿠아로빅</h3>
                      <p className="text-xs text-[#A39D8D]">물의 부력을 이용해 관절 부담 없이 전신 유산소가 가능합니다. 단, 평영(개구리헤엄)은 금물입니다.</p>
                    </div>
                  </div>
                </div>

                <div className="bg-[#1E1D17] rounded-3xl p-6 shadow-lg border border-[#2D2B23]">
                  <h2 className="text-lg font-bold text-[#F1EDE3] mb-4 flex items-center"><Stethoscope className="w-5 h-5 text-indigo-400 mr-2" /> 회복 가이드</h2>
                  <ul className="space-y-4">
                    <li className="flex items-start">
                      <CheckCircle className="w-5 h-5 text-emerald-500 mr-2 shrink-0" />
                      <p className="text-[#C2BCAB] text-sm"><strong className="text-[#F1EDE3]">폼롤러 필수:</strong> 허벅지 바깥쪽(장경인대)과 앞쪽을 매일 폼롤러로 아플 정도로 밀어주세요.</p>
                    </li>
                    <li className="flex items-start">
                      <CheckCircle className="w-5 h-5 text-emerald-500 mr-2 shrink-0" />
                      <p className="text-[#C2BCAB] text-sm"><strong className="text-[#F1EDE3]">하체 운동 주의:</strong> 하체 루틴(스쿼트, 런지 등) 진행 시 무릎에 통증이 발생하면 억지로 참고 하지 말고 즉시 중단하세요.</p>
                    </li>
                  </ul>
                </div>
              </div>
            )}

          </div>

          {/* 모바일 하단 네비게이션 */}
          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-[#1E1D17] border-t border-[#2D2B23] px-6 py-3 z-50">
            <div className="flex justify-between items-center max-w-md mx-auto">
              <button 
                onClick={() => setActiveTab('workout')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'workout' ? 'text-teal-400' : 'text-[#A39D8D]'}`}
              >
                <Dumbbell className="w-6 h-6 mb-1" />
                <span className="text-[10px] font-bold">루틴</span>
              </button>
              <button 
                onClick={() => setActiveTab('calendar')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'calendar' ? 'text-teal-400' : 'text-[#A39D8D]'}`}
              >
                <CalendarDays className="w-6 h-6 mb-1" />
                <span className="text-[10px] font-bold">기록</span>
              </button>
              <button 
                onClick={() => setActiveTab('knee')}
                className={`flex flex-col items-center p-2 transition-colors ${activeTab === 'knee' ? 'text-teal-400' : 'text-[#A39D8D]'}`}
              >
                <HeartPulse className="w-6 h-6 mb-1" />
                <span className="text-[10px] font-bold">케어</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
